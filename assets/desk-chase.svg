<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" shape-rendering="crispEdges">
  <title>juanmidev — escritorio pixel art, Tux le tira un código y lo persigue</title>

  <style>
    /* ---- shared timeline: 7s loop ---- */
    .codeCover   { animation: codeCover 7s linear infinite; }
    .guySit      { animation: guySitVis 7s steps(1,end) infinite, guySitShake 7s linear infinite; }
    .guyRun      { animation: guyRunVis 7s steps(1,end) infinite, guyRunPos 7s linear infinite; }
    .tux         { animation: tuxVis 7s steps(1,end) infinite, tuxPos 7s linear infinite; }
    .scroll      { animation: scrollVis 7s steps(1,end) infinite, scrollPos 7s linear infinite; }
    .flash       { animation: flashVis 7s linear infinite; }

    /* ---- fast, independent idle loops (run underneath, only visible while parent is) ---- */
    .handL       { animation: handBounceL 0.5s ease-in-out infinite; }
    .handR       { animation: handBounceR 0.5s ease-in-out infinite 0.25s; }
    .legsA       { animation: framesA 0.26s steps(1,end) infinite; }
    .legsB       { animation: framesB 0.26s steps(1,end) infinite; }
    .feetA       { animation: framesA 0.3s steps(1,end) infinite; }
    .feetB       { animation: framesB 0.3s steps(1,end) infinite; }
    .flipper     { animation: flipperWave 0.4s ease-in-out infinite; transform-origin: -1px -23px; }
    .scrollSpin  { animation: scrollSpin 0.35s linear infinite; }

    @keyframes codeCover {
      0%   { x: 515px; width: 96px; }
      25%  { x: 611px; width: 0px; }
      96%  { x: 611px; width: 0px; }
      97%  { x: 515px; width: 96px; }
      100% { x: 515px; width: 96px; }
    }

    @keyframes guySitVis {
      0%   { opacity: 1; }
      33%  { opacity: 1; }
      34%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes guySitShake {
      0%   { transform: translate(0px,0px); }
      30%  { transform: translate(0px,0px); }
      31%  { transform: translate(-2px,1px); }
      32%  { transform: translate(2px,-1px); }
      33%  { transform: translate(0px,0px); }
      100% { transform: translate(0px,0px); }
    }

    @keyframes guyRunVis {
      0%   { opacity: 0; }
      33%  { opacity: 0; }
      34%  { opacity: 1; }
      62%  { opacity: 1; }
      63%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes guyRunPos {
      0%   { transform: translate(430px,190px); }
      34%  { transform: translate(430px,190px); }
      63%  { transform: translate(766px,190px); }
      100% { transform: translate(430px,190px); }
    }

    @keyframes tuxVis {
      0%   { opacity: 0; }
      19%  { opacity: 0; }
      20%  { opacity: 1; }
      49%  { opacity: 1; }
      50%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes tuxPos {
      0%   { transform: translate(28px,190px); }
      20%  { transform: translate(28px,190px); }
      50%  { transform: translate(766px,190px); }
      100% { transform: translate(28px,190px); }
    }

    @keyframes scrollVis {
      0%   { opacity: 0; }
      26%  { opacity: 0; }
      27%  { opacity: 1; }
      32%  { opacity: 1; }
      33%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes scrollPos {
      0%   { transform: translate(176px,160px); }
      26%  { transform: translate(176px,160px); }
      31%  { transform: translate(430px,115px); }
      100% { transform: translate(430px,115px); }
    }
    @keyframes scrollSpin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes flashVis {
      0%   { opacity: 0; }
      30%  { opacity: 0; }
      31%  { opacity: 1; }
      33%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes handBounceL {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-2px); }
    }
    @keyframes handBounceR {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(2px); }
    }
    @keyframes framesA { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes framesB { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes flipperWave {
      0%   { transform: rotate(-15deg); }
      50%  { transform: rotate(25deg); }
      100% { transform: rotate(-15deg); }
    }
  </style>

  <!-- ================= ROOM: back wall + floor ================= -->
  <rect x="0" y="0" width="800" height="155" fill="#161b22"/>
  <rect x="0" y="155" width="800" height="45" fill="#21262d"/>
  <rect x="0" y="153" width="800" height="3" fill="#30363d"/>

  <!-- rug -->
  <rect x="200" y="155" width="400" height="40" fill="#58a6ff"/>
  <rect x="204" y="159" width="392" height="32" fill="#21262d"/>

  <!-- ================= LEFT DOOR (Tux entra por aquí) ================= -->
  <rect x="28" y="52" width="76" height="103" fill="#30363d"/>
  <rect x="34" y="59" width="62" height="92" fill="#21262d"/>
  <rect x="40" y="65" width="50" height="38" fill="#161b22"/>
  <rect x="40" y="107" width="50" height="38" fill="#161b22"/>
  <circle cx="88" cy="110" r="4" fill="#f5a623"/>

  <!-- ================= RIGHT DOOR (por donde huyen los dos) ================= -->
  <rect x="696" y="52" width="76" height="103" fill="#30363d"/>
  <rect x="702" y="59" width="62" height="92" fill="#21262d"/>
  <rect x="708" y="65" width="50" height="38" fill="#161b22"/>
  <rect x="708" y="107" width="50" height="38" fill="#161b22"/>
  <circle cx="708" cy="110" r="4" fill="#f5a623"/>

  <!-- ================= WALL DECOR ================= -->
  <!-- picture left -->
  <rect x="160" y="15" width="60" height="45" fill="#21262d"/>
  <rect x="166" y="21" width="24" height="33" fill="#58a6ff"/>
  <rect x="190" y="21" width="24" height="16" fill="#f85149"/>
  <rect x="190" y="37" width="24" height="17" fill="#3fb950"/>
  <!-- picture right -->
  <rect x="580" y="15" width="60" height="45" fill="#21262d"/>
  <rect x="586" y="21" width="24" height="33" fill="#3fb950"/>
  <rect x="610" y="21" width="24" height="16" fill="#58a6ff"/>
  <rect x="610" y="37" width="24" height="17" fill="#f85149"/>

  <!-- shelf with books -->
  <rect x="280" y="40" width="240" height="6" fill="#30363d"/>
  <rect x="286" y="20" width="10" height="20" fill="#58a6ff"/>
  <rect x="298" y="16" width="10" height="24" fill="#f85149"/>
  <rect x="310" y="22" width="10" height="18" fill="#3fb950"/>
  <rect x="322" y="18" width="10" height="22" fill="#58a6ff"/>
  <rect x="334" y="24" width="10" height="16" fill="#f85149"/>
  <rect x="360" y="20" width="10" height="20" fill="#3fb950"/>
  <rect x="372" y="16" width="10" height="24" fill="#58a6ff"/>
  <rect x="384" y="22" width="10" height="18" fill="#f85149"/>
  <rect x="430" y="18" width="10" height="22" fill="#3fb950"/>
  <rect x="442" y="24" width="10" height="16" fill="#58a6ff"/>
  <rect x="454" y="20" width="10" height="20" fill="#f85149"/>
  <!-- little plant on the shelf -->
  <rect x="492" y="28" width="12" height="12" fill="#30363d"/>
  <circle cx="495" cy="24" r="4" fill="#3fb950"/>
  <circle cx="502" cy="22" r="4" fill="#3fb950"/>
  <circle cx="498" cy="18" r="4" fill="#3fb950"/>

  <!-- hanging lamps -->
  <rect x="249" y="0" width="2" height="20" fill="#30363d"/>
  <rect x="240" y="20" width="20" height="10" fill="#f5a623"/>
  <rect x="248" y="30" width="4" height="3" fill="#ffffff"/>
  <rect x="549" y="0" width="2" height="20" fill="#30363d"/>
  <rect x="540" y="20" width="20" height="10" fill="#f5a623"/>
  <rect x="548" y="30" width="4" height="3" fill="#ffffff"/>

  <!-- ================= DESK SCENE (static props, recentered around x=400) ================= -->
  <g transform="translate(-160,0)">
  <rect x="470" y="150" width="10" height="45" fill="#21262d"/>
  <rect x="630" y="150" width="10" height="45" fill="#21262d"/>
  <rect x="460" y="140" width="200" height="10" fill="#30363d"/>

  <!-- chair -->
  <rect x="565" y="58" width="40" height="14" fill="#21262d"/>
  <rect x="555" y="68" width="60" height="95" fill="#21262d"/>
  <rect x="575" y="185" width="30" height="8" fill="#161b22"/>

  <!-- monitor -->
  <rect x="505" y="55" width="120" height="85" fill="#161b22"/>
  <rect x="515" y="63" width="100" height="68" fill="#010409"/>
  <rect x="545" y="140" width="40" height="6" fill="#161b22"/>

  <!-- keyboard -->
  <rect x="520" y="141" width="110" height="10" fill="#21262d"/>
  <rect x="528" y="144" width="94" height="2" fill="#30363d"/>

  <!-- code on screen -->
  <g font-family="monospace" font-size="9" fill="#00ff41">
    <text x="520" y="76">const dev = {</text>
    <text x="520" y="88">  name: 'juanmi',</text>
    <text x="520" y="100">  stack: [js, py],</text>
    <text x="520" y="112">  coffee: true</text>
    <text x="520" y="124">}</text>
  </g>
  <!-- typewriter cover: shrinks to reveal the code, resets each loop -->
  <rect class="codeCover" y="63" width="96" height="68" fill="#010409"/>

  <!-- ================= SITTING CHARACTER (4px grid, ~56x62) ================= -->
  <g class="guySit">
    <!-- curly hair -->
    <rect x="590" y="72" width="8" height="4" fill="#161b22"/>
    <rect x="602" y="72" width="8" height="4" fill="#161b22"/>
    <rect x="614" y="72" width="8" height="4" fill="#161b22"/>
    <rect x="586" y="76" width="40" height="4" fill="#161b22"/>
    <rect x="582" y="80" width="48" height="4" fill="#161b22"/>
    <rect x="582" y="84" width="8" height="4" fill="#161b22"/>
    <rect x="622" y="84" width="8" height="4" fill="#161b22"/>
    <rect x="582" y="88" width="8" height="4" fill="#161b22"/>
    <rect x="622" y="88" width="8" height="4" fill="#161b22"/>
    <rect x="586" y="92" width="8" height="4" fill="#161b22"/>
    <rect x="618" y="92" width="8" height="4" fill="#161b22"/>

    <!-- round head -->
    <rect x="590" y="84" width="32" height="4" fill="#ffffff"/>
    <rect x="590" y="88" width="32" height="4" fill="#ffffff"/>
    <rect x="594" y="92" width="24" height="4" fill="#ffffff"/>
    <rect x="594" y="96" width="24" height="4" fill="#ffffff"/>
    <rect x="594" y="100" width="24" height="4" fill="#ffffff"/>
    <!-- eyes -->
    <rect x="596" y="96" width="4" height="4" fill="#161b22"/>
    <rect x="608" y="96" width="4" height="4" fill="#161b22"/>
    <!-- neck -->
    <rect x="598" y="104" width="16" height="4" fill="#ffffff"/>

    <!-- torso -->
    <rect x="586" y="108" width="40" height="4" fill="#58a6ff"/>
    <rect x="590" y="112" width="32" height="4" fill="#58a6ff"/>
    <rect x="582" y="112" width="8" height="4" fill="#58a6ff"/>
    <rect x="622" y="112" width="8" height="4" fill="#58a6ff"/>
    <rect x="590" y="116" width="32" height="4" fill="#58a6ff"/>
    <rect x="582" y="116" width="8" height="4" fill="#58a6ff"/>
    <rect x="622" y="116" width="8" height="4" fill="#58a6ff"/>
    <rect x="590" y="120" width="32" height="4" fill="#58a6ff"/>
    <rect x="582" y="120" width="8" height="4" fill="#58a6ff"/>
    <rect x="622" y="120" width="8" height="4" fill="#58a6ff"/>
    <rect x="590" y="124" width="32" height="4" fill="#58a6ff"/>

    <!-- forearms reaching to the keyboard -->
    <g class="handL"><rect x="578" y="124" width="12" height="10" fill="#ffffff"/></g>
    <g class="handR"><rect x="622" y="124" width="12" height="10" fill="#ffffff"/></g>
  </g>

  <!-- impact flash when the scroll lands -->
  <circle class="flash" cx="604" cy="100" r="16" fill="#ffffff"/>
  </g>

  <!-- ================= STANDING / RUNNING CHARACTER (4px grid, ~52x68) ================= -->
  <g class="guyRun">
    <!-- curly hair -->
    <rect x="8" y="-64" width="8" height="4" fill="#161b22"/>
    <rect x="20" y="-64" width="8" height="4" fill="#161b22"/>
    <rect x="32" y="-64" width="8" height="4" fill="#161b22"/>
    <rect x="4" y="-60" width="44" height="4" fill="#161b22"/>
    <rect x="0" y="-56" width="52" height="4" fill="#161b22"/>
    <rect x="0" y="-52" width="8" height="4" fill="#161b22"/>
    <rect x="44" y="-52" width="8" height="4" fill="#161b22"/>
    <rect x="0" y="-48" width="8" height="4" fill="#161b22"/>
    <rect x="44" y="-48" width="8" height="4" fill="#161b22"/>
    <rect x="4" y="-44" width="8" height="4" fill="#161b22"/>
    <rect x="40" y="-44" width="8" height="4" fill="#161b22"/>

    <!-- round head -->
    <rect x="8" y="-52" width="36" height="4" fill="#ffffff"/>
    <rect x="8" y="-48" width="36" height="4" fill="#ffffff"/>
    <rect x="12" y="-44" width="28" height="4" fill="#ffffff"/>
    <rect x="12" y="-40" width="28" height="4" fill="#ffffff"/>
    <rect x="12" y="-36" width="28" height="4" fill="#ffffff"/>
    <!-- eyes -->
    <rect x="18" y="-40" width="4" height="4" fill="#161b22"/>
    <rect x="30" y="-40" width="4" height="4" fill="#161b22"/>
    <!-- neck -->
    <rect x="20" y="-32" width="12" height="4" fill="#ffffff"/>

    <!-- torso -->
    <rect x="8" y="-28" width="36" height="4" fill="#58a6ff"/>
    <rect x="8" y="-24" width="36" height="4" fill="#58a6ff"/>
    <rect x="8" y="-20" width="36" height="4" fill="#58a6ff"/>
    <rect x="8" y="-16" width="24" height="4" fill="#58a6ff"/>

    <!-- swinging arm -->
    <rect x="42" y="-24" width="8" height="16" fill="#58a6ff"/>
    <rect x="42" y="-8" width="8" height="6" fill="#ffffff"/>

    <!-- legs run-cycle -->
    <g class="legsA">
      <rect x="12" y="-16" width="10" height="16" fill="#21262d"/>
      <rect x="26" y="-16" width="10" height="10" fill="#21262d"/>
    </g>
    <g class="legsB">
      <rect x="12" y="-16" width="10" height="10" fill="#21262d"/>
      <rect x="26" y="-16" width="10" height="16" fill="#21262d"/>
    </g>
  </g>

  <!-- ================= TUX (4px grid): cuerpo negro ovalado, panza blanca, pico naranja ================= -->
  <g class="tux">
    <g class="flipper"><rect x="-4" y="-30" width="6" height="14" fill="#0d1117"/></g>

    <!-- black oval body -->
    <rect x="12" y="-44" width="16" height="4" fill="#0d1117"/>
    <rect x="8" y="-40" width="24" height="4" fill="#0d1117"/>
    <rect x="5" y="-36" width="30" height="4" fill="#0d1117"/>
    <rect x="2" y="-32" width="36" height="4" fill="#0d1117"/>
    <rect x="0" y="-28" width="40" height="4" fill="#0d1117"/>
    <rect x="0" y="-24" width="40" height="4" fill="#0d1117"/>
    <rect x="1" y="-20" width="38" height="4" fill="#0d1117"/>
    <rect x="3" y="-16" width="34" height="4" fill="#0d1117"/>
    <rect x="6" y="-12" width="28" height="4" fill="#0d1117"/>
    <rect x="10" y="-8" width="20" height="4" fill="#0d1117"/>

    <!-- white belly -->
    <rect x="8" y="-28" width="24" height="4" fill="#ffffff"/>
    <rect x="6" y="-24" width="28" height="4" fill="#ffffff"/>
    <rect x="6" y="-20" width="28" height="4" fill="#ffffff"/>
    <rect x="8" y="-16" width="24" height="4" fill="#ffffff"/>
    <rect x="10" y="-12" width="20" height="4" fill="#ffffff"/>
    <rect x="12" y="-8" width="16" height="4" fill="#ffffff"/>

    <!-- eye: white with black pupil -->
    <rect x="23" y="-38" width="8" height="8" fill="#ffffff"/>
    <rect x="26" y="-35" width="4" height="4" fill="#0d1117"/>

    <!-- orange beak -->
    <rect x="35" y="-33" width="7" height="5" fill="#f5a623"/>
    <rect x="42" y="-31" width="3" height="3" fill="#f5a623"/>

    <!-- orange feet run-cycle -->
    <g class="feetA">
      <rect x="8" y="-4" width="10" height="4" fill="#f5a623"/>
      <rect x="22" y="-4" width="10" height="4" fill="#f5a623"/>
    </g>
    <g class="feetB">
      <rect x="6" y="-4" width="10" height="4" fill="#f5a623"/>
      <rect x="24" y="-8" width="10" height="4" fill="#f5a623"/>
    </g>
  </g>

  <!-- ================= THROWN SCROLL / CODE ================= -->
  <g class="scroll">
    <g class="scrollSpin">
      <rect x="-6" y="-4" width="12" height="8" fill="#ffffff"/>
      <rect x="-8" y="-4" width="3" height="8" fill="#58a6ff"/>
      <rect x="5" y="-4" width="3" height="8" fill="#58a6ff"/>
      <rect x="-3" y="-2" width="6" height="1" fill="#00ff41"/>
      <rect x="-3" y="0" width="4" height="1" fill="#00ff41"/>
    </g>
  </g>
</svg>
