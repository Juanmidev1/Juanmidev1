<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120" font-family="monospace">
  <title>juanmidev — header</title>

  <style>
    text { font-family: monospace; }

    .nameFade { animation: nameFade 18s linear infinite; }

    .clip1 rect { animation: clip1 18s linear infinite; }
    .clip2 rect { animation: clip2 18s linear infinite; }
    .clip3 rect { animation: clip3 18s linear infinite; }
    .clip4 rect { animation: clip4 18s linear infinite; }

    .curVis1 { animation: curVis1 18s steps(1,end) infinite; }
    .curVis2 { animation: curVis2 18s steps(1,end) infinite; }
    .curVis3 { animation: curVis3 18s steps(1,end) infinite; }
    .curVis4 { animation: curVis4 18s steps(1,end) infinite; }
    .blink   { animation: blink 1s steps(1,end) infinite; }

    @keyframes nameFade {
      0%    { opacity: 0; }
      5.56% { opacity: 1; }
      100%  { opacity: 1; }
    }

    /* each phrase occupies a 25% slot of the 18s loop:
       type (~2s) -> hold (~2s) -> erase (~0.5s) -> next phrase */
    @keyframes clip1 {
      0%     { width: 0px; }
      11.11% { width: 384px; }
      22.22% { width: 384px; }
      25%    { width: 0px; }
      100%   { width: 0px; }
    }
    @keyframes clip2 {
      0%     { width: 0px; }
      25%    { width: 0px; }
      36.11% { width: 528px; }
      47.22% { width: 528px; }
      50%    { width: 0px; }
      100%   { width: 0px; }
    }
    @keyframes clip3 {
      0%     { width: 0px; }
      50%    { width: 0px; }
      61.11% { width: 259px; }
      72.22% { width: 259px; }
      75%    { width: 0px; }
      100%   { width: 0px; }
    }
    @keyframes clip4 {
      0%     { width: 0px; }
      75%    { width: 0px; }
      86.11% { width: 403px; }
      97.22% { width: 403px; }
      100%   { width: 0px; }
    }

    @keyframes curVis1 {
      0%     { opacity: 0; }
      11.11% { opacity: 0; }
      11.12% { opacity: 1; }
      22.22% { opacity: 1; }
      22.23% { opacity: 0; }
      100%   { opacity: 0; }
    }
    @keyframes curVis2 {
      0%     { opacity: 0; }
      36.11% { opacity: 0; }
      36.12% { opacity: 1; }
      47.22% { opacity: 1; }
      47.23% { opacity: 0; }
      100%   { opacity: 0; }
    }
    @keyframes curVis3 {
      0%     { opacity: 0; }
      61.11% { opacity: 0; }
      61.12% { opacity: 1; }
      72.22% { opacity: 1; }
      72.23% { opacity: 0; }
      100%   { opacity: 0; }
    }
    @keyframes curVis4 {
      0%     { opacity: 0; }
      86.11% { opacity: 0; }
      86.12% { opacity: 1; }
      97.22% { opacity: 1; }
      97.23% { opacity: 0; }
      100%   { opacity: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
  </style>

  <!-- background -->
  <rect x="0" y="0" width="800" height="120" fill="#0d1117"/>

  <!-- name -->
  <text class="nameFade" x="400" y="55" text-anchor="middle" font-size="42" font-weight="bold" fill="#ffffff">Juanmidev</text>

  <!-- phrase 1 -->
  <clipPath class="clip1" id="clip1"><rect x="208" y="69" width="0" height="22"/></clipPath>
  <text x="208" y="88" font-size="16" fill="#58a6ff" clip-path="url(#clip1)">Software engineer &amp; automation architect</text>
  <g class="curVis1"><g class="blink"><text x="596" y="88" font-size="16" fill="#00ff41">_</text></g></g>

  <!-- phrase 2 -->
  <clipPath class="clip2" id="clip2"><rect x="136" y="69" width="0" height="22"/></clipPath>
  <text x="136" y="88" font-size="16" fill="#58a6ff" clip-path="url(#clip2)">AI as a tool, not a crutch — real systems, real results</text>
  <g class="curVis2"><g class="blink"><text x="668" y="88" font-size="16" fill="#00ff41">_</text></g></g>

  <!-- phrase 3 -->
  <clipPath class="clip3" id="clip3"><rect x="270" y="69" width="0" height="22"/></clipPath>
  <text x="270" y="88" font-size="16" fill="#58a6ff" clip-path="url(#clip3)">Turning ideas into products</text>
  <g class="curVis3"><g class="blink"><text x="533" y="88" font-size="16" fill="#00ff41">_</text></g></g>

  <!-- phrase 4 -->
  <clipPath class="clip4" id="clip4"><rect x="198" y="69" width="0" height="22"/></clipPath>
  <text x="198" y="88" font-size="16" fill="#58a6ff" clip-path="url(#clip4)">Self-taught &#183; Years of real-world practice</text>
  <g class="curVis4"><g class="blink"><text x="605" y="88" font-size="16" fill="#00ff41">_</text></g></g>
</svg>
